name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/AnyPC.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish src/AnyPC.Windows/AnyPC.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.$env:GITHUB_RUN_NUMBER" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=..\publish" installer\AnyPC.iss
          Copy-Item publish\AnyPC.exe out\AnyPC-Portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AnyPC-Windows
          path: |
            out/AnyPC-Setup.exe
            out/AnyPC-Portable.exe

      # Every push to the default branch publishes a release, so the download page's
      # releases/latest/download/... links always point at the newest build.
      - name: Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: AnyPC Desktop ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/AnyPC-Setup.exe
            out/AnyPC-Portable.exe
